# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  #n: [0.50, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 2,602,272 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 272 layers, 9,284,096 parameters, 9,284,080 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs
  l: [1.00, 1.00, 512] # summary: 488 layers, 26,450,784 parameters, 26,450,768 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 488 layers, 59,210,784 parameters, 59,210,768 gradients, 200.3 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, PConv, [64, 3, 2]]         # 0 - P1/2
  - [-1, 1, PConv, [128, 3, 2]]        # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, PConv, [256, 3, 2]]        # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, PConv, [512, 3, 2]]        # 5 - P4/16
  - [-1, 4, A2C2f, [512, True, 4]]    # 6
  - [-1, 1, PConv, [1024, 3, 2]]       # 7 - P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]   # 8

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]]                  # 10
  - [-1, 2, A2C2f, [512, False, 0.25]]           # 11

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]]                  # 13
  - [-1, 2, A2C2f, [256, False, 0.25]]           # 14

  # P3 -> P2 (新增)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 1], 1, Concat, [1]]                  # 16  con(concat with backbone P2)
  - [-1, 2, C3k2, [128, False, 0.25]]           # 17  (P2/4-small)

  # P2 -> P3 path for detection
  - [-1, 1, PConv, [256, 3, 2]]                 # 18
  - [[-1, 14], 1, Concat, [1]]                 # 19
  - [-1, 2, A2C2f, [256, False, 0.25]]           # 20 ######
  - [-1, 1, ContextAggregation,[256]]           #21              T

  # P3 -> P4 path for detection
  - [-1, 1, PConv, [512, 3, 2]]                 # 22
  - [[-1, 11], 1, Concat, [1]]                 # 23
  - [-1, 2, A2C2f, [512, False, 0.25]]           # 24 ########
  - [-1, 1, ContextAggregation,[512]]            #25             T

  # P4 -> P5 path for detection
  - [-1, 1, PConv, [512, 3, 2]]                 # 26
  - [[-1, 8], 1, Concat, [1]]                  # 27
  - [-1, 2, C3k2, [1024, True]]                # 28 (P5/32) ########
  - [-1, 1, ContextAggregation,[1024]]           #29             T
  - [17,1,DASI,[128]]           #30
  #################################################################################
  - [30, 1, PConv, [256, 3, 2]]                # 31  P2_down (-> P3 尺度)
  - [[-1,21],1, WeightedAdd,[256]]             #32


  # 新P3 ⊕ P4 -> 给 P4（下采样 新P3 到 P4 尺度，再 1x1 降维到 512）
  - [32, 1, PConv, [512, 3, 2]]                # 33  newP3_down (-> P4 尺度)
  - [[-1,25],1, WeightedAdd,[512]]             #34

  # 新P4 ⊕ P5 -> 给 P5（下采样 新P4 到 P5 尺度，再 1x1 降维到 1024）
  - [34, 1, PConv, [1024, 3, 2]]               # 35  newP4_down (-> P5 尺度)
  - [[-1,29],1, WeightedAdd,[1024]]            #36


  # Detect head (P2, P3, P4, P5)
  - [[30, 32, 34, 36], 1, Detect, [nc]]        # 31