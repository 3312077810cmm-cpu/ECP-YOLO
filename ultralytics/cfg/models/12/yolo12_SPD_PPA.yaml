# YOLO12n backbone
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 2,602,272 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 272 layers, 9,284,096 parameters, 9,284,080 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs
  l: [1.00, 1.00, 512] # summary: 488 layers, 26,450,784 parameters, 26,450,768 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 488 layers, 59,210,784 parameters, 59,210,768 gradients, 200.3 GFLOPs

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2         0
  - [-1, 1, Conv, [128, 3, 1]]         # 1-P2/4         1
  - [-1, 1, SPDConv, [128]]            #                2
  - [-1, 2, C3k2, [128, False, 0.25]]  #                3
  - [-1, 1, Conv, [256, 3, 1]]         # 3-P3/8         4
  - [-1, 1, SPDConv, [256]]            #                5
  - [-1, 2, C3k2, [256, False, 0.25]]#                  6
  - [-1, 1, Conv, [512, 3, 1]]         # 5-P4/16        7
  - [-1, 1, SPDConv, [512]]#                            8
  - [-1, 4, A2C2f, [512, True, 4]]#                     9
  - [-1, 1, Conv, [1024, 3, 1]]        # 7-P5/32        10
  - [-1, 1, SPDConv, [1024]]#                           11
  - [-1, 4, A2C2f, [1024, True, 1]]#                    12

# YOLO12n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]#         13
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4          14
  - [-1, 2, A2C2f, [512, False, -1]] # 11               15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]#          16
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3          17
  - [-1, 2, A2C2f, [256, False, -1]] # 14                18

  - [-1, 1, Conv, [256, 3, 2]]#                          19
  - [[-1, 15], 1, Concat, [1]] # cat head P4              20
  - [-1, 2, A2C2f, [512, False, -1]] # 17                21

  - [-1, 1, Conv, [512, 3, 2]]#                            22
  - [[-1, 12], 1, Concat, [1]] # cat head P5             23
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)         24

  - [18,1,PPA,[256]] #25
  - [21,1,PPA,[512]]#26
  - [24,1,PPA,[1024]]#27

  - [[25, 26, 27], 1, Detect, [nc]] # Detect(P3, P4, P5)