# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 2,602,272 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 272 layers, 9,284,096 parameters, 9,284,080 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs
  l: [1.00, 1.00, 512] # summary: 488 layers, 26,450,784 parameters, 26,450,768 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 488 layers, 59,210,784 parameters, 59,210,768 gradients, 200.3 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, PConv, [64, 3, 2]]         # 0 - P1/2
  - [-1, 1, PConv, [128, 3, 2]]        # 1 - P2/4
  - [-1 ,1, FCAttention,[128]]         #2


  - [-1, 2, C3k2, [256, False, 0.25]] # 3
  - [-1, 1, PConv, [256, 3, 2]]        # 4 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, PConv, [512, 3, 2]]        # 6 - P4/16
  - [-1, 4, A2C2f, [512, True, 4]]    # 7
  - [-1, 1, PConv, [1024, 3, 2]]       # 8 - P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]   # 9
  - [-1, 1, FCAttention, [1024]]               #10

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 7], 1, Concat, [1]]                  # 12
  - [-1, 2, A2C2f, [512, False, 0.25]]           # 13

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 5], 1, Concat, [1]]                  # 15
  - [-1, 2, A2C2f, [256, False, 0.25]]           # 16

  # P3 -> P2 (新增)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 1], 1, Concat, [1]]                  # 18  con(concat with backbone P2)
  - [-1, 2, C3k2, [128, False, 0.25]]           # 19  (P2/4-small)

  # P2 -> P3 path for detection
  - [-1, 1, PConv, [256, 3, 2]]                 # 20
  - [[-1, 16], 1, Concat, [1]]                 # 21
  - [-1, 2, A2C2f, [256, False, 0.25]]           # 22

  # P3 -> P4 path for detection
  - [-1, 1, PConv, [512, 3, 2]]                 # 23
  - [[-1, 13], 1, Concat, [1]]                 # 24
  - [-1, 2, A2C2f, [512, False, 0.25]]           # 25

  # P4 -> P5 path for detection
  - [-1, 1, PConv, [512, 3, 2]]                 # 26
  - [[-1, 10], 1, Concat, [1]]                  # 27
  - [-1, 2, C3k2, [1024, True]]                # 28 (P5/32)

  - [19,1,DASI,[128]]           #29

  # Detect head (P2, P3, P4, P5)
  - [[29, 22, 25, 28], 1, Detect, [nc]]        # 30